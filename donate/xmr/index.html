<style>
 :root{
  --bg:#ffffff; --bg-alt:#f6f8fb; --fg:#202124; --fg-dim:#5f6368; --border:#e2e5ea;
  --accent:#1967d2; --accent-dim:#e8f0fe; --card-bg:#ffffff; --card-shadow:0 1px 2px 0 rgba(60,64,67,.15), 0 1px 3px 1px rgba(60,64,67,.1);
 }
 @media (prefers-color-scheme:dark){
  :root{
   --bg:#131417; --bg-alt:#1a1c20; --fg:#e8eaed; --fg-dim:#9aa0a6; --border:#2c2f34;
   --accent:#8ab4f8; --accent-dim:#1e2a3d; --card-bg:#1a1c20; --card-shadow:0 1px 2px 0 rgba(0,0,0,.4), 0 1px 3px 1px rgba(0,0,0,.3);
  }
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
      display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
 main{max-width:360px;width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
      box-shadow:var(--card-shadow);padding:28px 24px;text-align:center}
 h1{font-size:19px;margin:0 0 6px}
 p{color:var(--fg-dim);font-size:14px;margin:0 0 20px}
 img{width:170px;height:170px;border-radius:10px;border:1px solid var(--border);margin:0 0 16px}
 code{display:block;word-break:break-all;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;
      padding:10px 12px;font-size:12.5px;margin:0 0 16px}
 a.button{display:inline-block;width:100%;background:var(--accent);color:#fff;text-decoration:none;
          font-weight:600;font-size:14px;padding:12px 16px;border-radius:10px}
 button.copy{width:100%;margin-top:10px;background:transparent;color:var(--accent);border:1px solid var(--accent);
             font-weight:600;font-size:14px;padding:11px 16px;border-radius:10px;cursor:pointer;font-family:inherit}
 .home{display:inline-block;margin-top:18px;color:var(--fg-dim);font-size:13px;text-decoration:none}
